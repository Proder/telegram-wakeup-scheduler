name: Security IOC Gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ioc-gate:
    name: ioc-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked files and changed files as inert text
        env:
          IOC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/ioc-gate.sh

