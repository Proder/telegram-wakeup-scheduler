name: Security IOC Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - dev
      - "release/**"

permissions:
  contents: read

jobs:
  ioc-gate:
    name: ioc-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve trusted scanner outside either checkout
        run: cp trusted/scripts/security/ioc-gate.sh "$RUNNER_TEMP/ioc-gate.sh"

      - name: Check out pull-request candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pushed commit as data
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Scan candidate files with trusted scanner
        working-directory: candidate
        env:
          IOC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash "$RUNNER_TEMP/ioc-gate.sh"

